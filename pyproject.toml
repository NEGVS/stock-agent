[project]
name = "stock-agent"
version = "0.1.0"
description = "AI-powered stock analysis system using LangGraph and multi-agent architecture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.3.12",
    "langchain-openai>=1.3.4",
    "langgraph>=1.2.8",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
